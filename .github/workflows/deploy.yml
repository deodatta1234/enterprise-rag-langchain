name: Deploy Enterprise RAG API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
      WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
      WEAVIATE_COLLECTION: PdfChunk

      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_TRACING: "false"
      LANGSMITH_PROJECT: enterprise-rag-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Python / evaluation setup
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Check evaluation environment
        run: |
          python - <<'PY'
          import os

          required = [
              "OPENAI_API_KEY",
              "WEAVIATE_URL",
              "WEAVIATE_API_KEY",
              "LANGSMITH_API_KEY",
          ]

          missing = [
              name
              for name in required
              if not os.getenv(name)
          ]

          if missing:
              print("Missing environment variables:")
              for name in missing:
                  print(f"- {name}")
              raise SystemExit(1)

          print("Evaluation environment configured.")
          print(
              "WEAVIATE_COLLECTION:",
              os.getenv("WEAVIATE_COLLECTION"),
          )
          PY

      # ---------------------------------------------------------
      # RAG quality gates
      # ---------------------------------------------------------

      - name: Run RAG evaluation suite
        run: |
          python -m evaluation.run_all

      # Disabled while deploying without tracing; credentials remain configured.
      # This runner explicitly enables tracing, so it must also stay disabled.
      # - name: Evaluate deployment candidate in LangSmith
      #   run: |
      #     python -m evaluation.langsmith_eval --variant hybrid-rerank

      # ---------------------------------------------------------
      # Azure deployment
      # Only reached if ALL evaluations pass
      # ---------------------------------------------------------

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}"

      - name: Install Container Apps extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --yes

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}" \
            --set-env-vars LANGSMITH_TRACING=false

      - name: Show deployed image
        run: |
          az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv
