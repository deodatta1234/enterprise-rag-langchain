name: Deploy Enterprise RAG API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.ACR_NAME }}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}"

      - name: Install Container Apps extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade \
            --yes

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ github.sha }}"

      - name: Show deployed image
        run: |
          az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check evaluation environment
        env:
          WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
          WEAVIATE_COLLECTION: PdfChunk

        run: |
          python - <<'PY'
          import os

          print("WEAVIATE_URL present:", bool(os.getenv("WEAVIATE_URL")))
          print("WEAVIATE_API_KEY present:", bool(os.getenv("WEAVIATE_API_KEY")))
          print("WEAVIATE_COLLECTION:", os.getenv("WEAVIATE_COLLECTION"))
          PY

      - name: Run retrieval evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
          WEAVIATE_COLLECTION: PdfChunk

          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: enterprise-rag-ci

        run: |
          python -m evaluation.run_eval